name: Next Branch CI (Svelte + WebGPU)

# #542: CI for the long-lived epic branch `next/svelte-webgpu`. Lighter than
# the main `Playwright E2E Tests` workflow:
#   * `preflight` runs lint, build, unit suite, shuffled run, coverage gate.
#   * `smoke` boots the SvelteKit scaffold.
#   * `e2e-shards` runs the Playwright specs that pass on SwiftShader today
#     (the "software-adapter"-safe subset defined in playwright.config.next.ts).
#   * `webgpu-engine` runs the engine smokes against the shared canvas.
#   * `gpu-smoke` + the engine job's GPU leg are opt-in on the GPU_RUNNER_LABEL
#     repository variable; see the job comments below.
#
# AC2 widens `e2e-shards` as screens stabilise under WebGPU and specs are
# ported / scene-health is re-pointed at the WebGPU engine.

on:
  push:
    branches: [ next/svelte-webgpu ]
  pull_request:
    branches: [ next/svelte-webgpu ]

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/npm-preflight.yml

  smoke:
    name: Scaffold smoke (SvelteKit boots at base path)
    needs: preflight
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke — boot the scaffold
        # The config's webServer builds and previews the app at
        # /virtualrow/app/; this spec asserts the title and base path.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/svelte-scaffold-smoke.spec.ts

  # #542 AC2 — the Playwright e2e suite, restricted to the specs that pass
  # under SwiftShader on default runners today. See
  # `playwright/playwright.config.next.ts` for the testIgnore list; the shard
  # plan is the same measured-time split the main workflow uses, through
  # `scripts/e2e-shards.mjs`.
  #
  # The config is handed in via E2E_SHARDS_CONFIG so the shard planner lists
  # tests through it (otherwise it still asks `playwright.config.ci.ts`,
  # which would include specs this branch cannot pass yet).
  e2e-shards:
    name: e2e shards ${{ matrix.shard }}/2 (ubuntu, SwiftShader)
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: true
      E2E_SHARDS_CONFIG: playwright/playwright.config.next.ts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run shard
        run: node scripts/e2e-shards.mjs ${{ matrix.shard }}/2 --retries=2
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: next-branch-playwright-report-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # #542 AC6 / D5-b — the dedicated GPU runner (SwiftShader fallback).
  #
  # GitHub's default runners rasterise through SwiftShader, which ships no
  # WebGPU backend, so the hand-written WebGPU engine's real-GPU paths cannot
  # run on them. This job runs on a GitHub-hosted GPU larger runner when one is
  # configured and proves it actually has a hardware WebGPU adapter
  # (scripts/gpu-runner-smoke.mjs). Later phases run the engine's GPU specs here.
  #
  # It is OPT-IN, gated on the `GPU_RUNNER_LABEL` repository variable: until that
  # variable names a provisioned GPU runner, the job is skipped and every other
  # job keeps its SwiftShader fallback — so this workflow can never hang waiting
  # for a runner that does not exist. To turn it on: create the GPU larger runner
  # in the repo's Actions settings, then set the repository variable
  # GPU_RUNNER_LABEL to that runner's label.
  gpu-smoke:
    name: GPU runner smoke (real WebGPU adapter present)
    needs: preflight
    if: ${{ vars.GPU_RUNNER_LABEL != '' }}
    runs-on: ${{ vars.GPU_RUNNER_LABEL }}
    env:
      CI: true
      REQUIRE_REAL_GPU: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove the runner has a hardware WebGPU adapter
        run: node scripts/gpu-runner-smoke.mjs

  webgpu-engine:
    # #550 D8-b: the engine's one Playwright smoke, run on a GPU-backed
    # runner when one is provisioned, with SwiftShader as the fallback. The
    # runner label is picked up from the repo variable `GPU_RUNNER_LABEL`
    # (same convention as the gpu-smoke job this workflow also runs).
    # continue-on-error: true until a real WebGPU adapter is reachable; the
    # smoke still runs with --enable-unsafe-webgpu so we exercise the fallback
    # branches today.
    name: WebGPU engine smoke (#550)
    needs: preflight
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'ubuntu-latest' }}
    continue-on-error: ${{ vars.GPU_RUNNER_LABEL == '' }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke — attach the engine, draw one frame, read telemetry
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-engine-smoke.spec.ts
      - name: Smoke — scenery pools + compute cull + drawIndirect (#555)
        # D7-a / D8-a: scenery runs on the same job as the engine smoke; the
        # smoke page under /smoke/scenery feeds a canned foliage pool set.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-scenery-smoke.spec.ts
      - name: Smoke — flora LOD + texture pipeline (#562)
        # P5-AC4: flora LOD runs on the same job as the engine smoke; the
        # smoke page under /smoke/flora exercises the solid + sprite passes
        # and the lazy KTX2/PNG atlas path. SwiftShader is OK since the
        # decoder currently returns null → PNG fallback.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-flora-smoke.spec.ts
      - name: Smoke — CSM + flora shadow depth pass (#559)
        # P4-AC4: shadows run on the same job as the engine smoke; the
        # smoke page under /smoke/shadows feeds a canned foliage pool
        # set so the shadow stage has casters.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-shadows-smoke.spec.ts
