# One-off: records the #493 OSM reference fixtures from a runner that can reach
# Overpass (cloud agent sessions can't), and commits them back to the PR branch.
# Remove before merging #494.
name: Record OSM fixtures (#493)

on:
  push:
    branches: [claude/project-thread-2c6jt7]
    paths:
      - .github/workflows/record-osm-fixtures.yml
      - scripts/record-osm-fixtures.ts

permissions:
  contents: write

concurrency:
  group: record-osm-fixtures
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/record-osm-fixtures.ts
      - name: Commit the fixtures back to the branch
        # Commit whatever was recorded even if one course failed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__/fixtures/osm/
          if git diff --cached --quiet; then echo "No fixture changes"; exit 0; fi
          ls -l src/__tests__/fixtures/osm/
          git commit -m "#493 Phase 1 — record OSM reference fixtures for the accuracy test"
          git push origin HEAD:${GITHUB_REF_NAME}
