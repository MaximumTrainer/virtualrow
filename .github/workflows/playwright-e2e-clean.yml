# TEMPORARY - transfer branch, never merged. Records the three published
# screenshots on the reference renderer (Linux/SwiftShader, same setup as the
# `visual` job) and prints them into the log, because the session doing the
# commit cannot reach Actions artifact storage.
name: Playwright E2E Tests
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  record-docs:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      CI: true
      VITE_INTERVALS_CLIENT_ID: "playwright-e2e-client"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run pretest:e2e
      - name: Record the docs baselines
        run: npx playwright test --config=playwright/playwright.config.visual.ts --project=docs --update-snapshots=all
        timeout-minutes: 30
      - name: Print them
        run: |
          for f in docs/screenshot-rower-3d.png docs/screenshot-activity.png docs/screenshot-route-selection.png; do
            echo "BEGIN $f $(sha256sum "$f" | cut -d' ' -f1)"
            base64 -w 0 "$f" | fold -w 8000 | sed "s|^|B64 $f |"
            echo "END $f"
          done
