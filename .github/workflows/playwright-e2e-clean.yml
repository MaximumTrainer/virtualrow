# TEMPORARY - which part of #390 makes the windows single-route test hang. Never merged.
name: Playwright E2E Tests
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        variant: [head, oldmount, main]
        runner: [a, b]
    runs-on: windows-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      CI: true
      VITE_INTERVALS_CLIENT_ID: "playwright-e2e-client"
      VITE_BENCH_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.variant == 'main' && 'main' || github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run pretest:e2e
      - run: node scripts/kill-ports.mjs 9001 9002 9003 9004 9005 9006 9007 9008
      - name: Single route
        run: npx playwright test --config=playwright/playwright.config.ci.ts --project=default playwright/tests/virtualrow.spec.ts -g "plays a single route" --workers=2 --retries=0 --repeat-each=4 --reporter=list
        timeout-minutes: 40
