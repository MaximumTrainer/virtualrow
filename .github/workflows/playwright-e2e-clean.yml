# TEMPORARY - foliage cost benchmark for #333 on the runners that regressed. Never merged.
name: Playwright E2E Tests
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      CI: true
      VITE_INTERVALS_CLIENT_ID: "playwright-e2e-client"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run pretest:e2e
      - name: Benchmark
        run: npx playwright test --config=playwright/playwright.config.ci.ts --project=default playwright/tests/bench/foliage.bench.spec.ts --workers=1 --retries=0 --reporter=list
        timeout-minutes: 40
