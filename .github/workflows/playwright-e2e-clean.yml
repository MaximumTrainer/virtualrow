# TEMPORARY - transfer branch, never merged. Records every visual baseline on
# the reference renderer (Linux/SwiftShader, the `visual` job's setup) and
# prints them into the log, because the session committing them cannot reach
# Actions artifact storage.
name: Playwright E2E Tests
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  record-baselines:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      CI: true
      VITE_INTERVALS_CLIENT_ID: "playwright-e2e-client"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run pretest:e2e
      - name: Record every visual baseline
        run: npm run test:visual:update
        timeout-minutes: 45
      - name: Print them
        run: |
          for f in docs/screenshot-rower-3d.png docs/screenshot-activity.png docs/screenshot-route-selection.png playwright/tests/visual/__snapshots__/*.png; do
            echo "BEGIN $f $(sha256sum "$f" | cut -d' ' -f1)"
            base64 -w 0 "$f" | fold -w 8000 | sed "s|^|B64 $f |"
            echo
            echo "END $f"
          done
