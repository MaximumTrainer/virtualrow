name: NPM Preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: NPM Build and Unit Tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Kept at zero by #203. Runs before the build so a style regression is
        # reported on its own line rather than buried behind a type error.
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Run unit tests
        run: npm run test -- --run

      - name: Run unit tests in shuffled order
        # Guards against order-dependent suites (#201). A test that only passes
        # because some other suite ran first fails here. The seed is echoed so
        # a failure is reproducible: npm run test -- --run --sequence.shuffle
        # --sequence.seed=<seed>
        run: |
          SEED=$RANDOM
          echo "vitest shuffle seed: $SEED"
          npm run test -- --run --sequence.shuffle --sequence.seed=$SEED

      - name: Run unit-test coverage gate
        # Thresholds are configured in vitest.config.ts (`test.coverage.thresholds`).
        # vitest exits non-zero if the configured per-metric thresholds are missed,
        # turning this into a hard CI gate.
        run: npm run coverage
