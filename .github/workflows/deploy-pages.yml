name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. Cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_try_2.outputs.page_url || steps.deployment_try_1.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app for GitHub Pages
        run: npx vite build --base=/virtualrow/app/
        env:
          NODE_ENV: production
          VITE_INTERVALS_CLIENT_ID: ${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}
          # #473 FR4/FR5: bake the deploy's commit SHA into the client so a
          # crash report says which build crashed. `github.sha` is the full
          # 40-char SHA; the service truncates in `redactCrashPayload`.
          VITE_BUILD_SHA: ${{ github.sha }}
          # #473 Phase 3 (D1 = a): the real `repository_dispatch` endpoint
          # and token. When either is unset the stub transport stays in
          # place and the service short-circuits on `no-endpoint` (FR5), so
          # a build without these two secrets ships green and silent.
          VITE_CRASH_REPORT_ENDPOINT: ${{ secrets.CRASH_REPORT_ENDPOINT }}
          VITE_CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}

      - name: Copy app build into docs/app/
        run: |
          mkdir -p docs/app
          cp -r dist/. docs/app/

      # #542: publish the next/svelte-webgpu epic branch as a preview at
      # /virtualrow/next/, alongside the production app at /virtualrow/app/.
      # GitHub Pages serves one site, so the preview rides this deploy's
      # artifact rather than a second deploy that would clobber /app — it
      # refreshes whenever main deploys (the epic branch is cherry-picked
      # forward). Both steps are continue-on-error: a broken epic branch
      # leaves last good /next (or none) and never blocks the /app deploy.
      # Removed at the AC12 cutover, when the branch replaces main.
      - name: Checkout next/svelte-webgpu
        id: next_checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: next/svelte-webgpu
          path: next-preview

      - name: Build next/svelte-webgpu preview into docs/next/
        if: steps.next_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: next-preview
        env:
          NODE_ENV: production
          BASE_PATH: /virtualrow/next
          VITE_INTERVALS_CLIENT_ID: ${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_CRASH_REPORT_ENDPOINT: ${{ secrets.CRASH_REPORT_ENDPOINT }}
          VITE_CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: |
          npm ci
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/docs/next"
          cp -r build/. "$GITHUB_WORKSPACE/docs/next/"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_try_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_try_2
        if: steps.deployment_try_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment
        if: steps.deployment_try_1.outcome == 'failure' && steps.deployment_try_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
