# Neon healthcheck (issue #441, FR5).
#
# Opens one short-lived `SELECT 1` against the Neon `virtualrow_ci_readonly`
# role with `sslmode=verify-full` + `channel_binding=require`, then closes it.
# Asserts on the live connection that the negotiated TLS version is >= 1.2
# and that channel binding is `SCRAM-SHA-256-PLUS` — a downgrade to a URL
# without either MUST fail red (AC11 / AC12). The workflow log carries a
# single "ok" or "fail" line; the connection string, host and query results
# are never printed (NFR-S4 / NFR6).
#
# Runs weekly and on manual dispatch. On forks and while the Neon project /
# secret have not yet been provisioned, the job SKIPS with a `::warning::`
# annotation naming the missing secret — main stays green, but the warning
# is visible on every scheduled run until Phase 1 of #441 is done. Once a
# URL is present, the TLS and channel-binding assertions are hard-red.

name: Neon healthcheck

on:
  schedule:
    - cron: '17 4 * * 0'  # Sunday 04:17 UTC, matches contract-upload.yml's shape
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    if: github.repository == 'MaximumTrainer/virtualrow'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install pg client
        run: npm install --no-save --no-audit --no-fund pg@8.13.0

      - name: Check whether the Neon secret is configured
        id: gate
        env:
          NEON_CI_READONLY_URL: ${{ secrets.NEON_CI_READONLY_URL }}
        run: |
          # When the secret is absent (Phase 1 of #441 not yet done, or a
          # fork), skip the live check with a visible warning annotation.
          # Main stays green, but the warning surfaces on every scheduled
          # run until Dan populates the secret.
          if [ -z "${NEON_CI_READONLY_URL:-}" ]; then
            echo "::warning title=Neon healthcheck skipped::NEON_CI_READONLY_URL is not set on this repository — see docs/postgres.md Phase 1"
            echo "skip: NEON_CI_READONLY_URL is not set on this repository"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # URL is present, so its shape must be right — a URL that talks
          # to Neon without verify-full or channel_binding IS a real
          # security problem, and this step goes red (AC11 / AC12).
          # Only the two required parameters are inspected; the connection
          # string itself never reaches the log.
          case "$NEON_CI_READONLY_URL" in
            *"sslmode=verify-full"*) : ;;
            *) echo "fail: NEON_CI_READONLY_URL is missing sslmode=verify-full"; exit 1;;
          esac
          case "$NEON_CI_READONLY_URL" in
            *"channel_binding=require"*) : ;;
            *) echo "fail: NEON_CI_READONLY_URL is missing channel_binding=require"; exit 1;;
          esac
          echo "ok: NEON_CI_READONLY_URL declares verify-full + channel_binding"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Connect, query, assert TLS posture
        if: steps.gate.outputs.configured == 'true'
        env:
          NEON_CI_READONLY_URL: ${{ secrets.NEON_CI_READONLY_URL }}
        run: node .github/scripts/neon-healthcheck.mjs

      - name: Guard the client bundle against Neon leakage (AC3 / AC10)
        run: |
          # A future contributor cannot pass this job with a VITE_NEON_* env
          # in the build. The Pages build reads no NEON_* secret, so this is
          # just a hard grep of the committed dist/ directory shape.
          if find dist -type f 2>/dev/null | grep -q .; then
            echo "fail: dist/ is committed to the repo — it must not be"
            exit 1
          fi
          # Grep the source tree for accidental leakage of any of the secret
          # names into shipped code.
          set +e
          hits=$(grep -RnE 'VITE_NEON|neon\.tech|postgres://|virtualrow_(owner|app|ci_readonly)' src public 2>/dev/null)
          set -e
          if [ -n "$hits" ]; then
            echo "fail: source references a Neon credential or hostname:"
            echo "$hits"
            exit 1
          fi
          echo "ok: no Neon references in the client source tree"
